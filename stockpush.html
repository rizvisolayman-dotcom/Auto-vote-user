<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOLAYMAN Channel</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;background:#0b1220;color:#e5e7eb;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}
  .c{padding:24px}
  h1{font-size:17px;color:#22c55e;margin:0 0 8px}
  p{font-size:13px;color:#9ca3af;margin:4px 0}
  button{background:#374151;color:#e5e7eb;border:0;border-radius:8px;padding:8px 16px;margin-top:14px;font-size:13px}
</style>
</head>
<body>
<div class="c">
  <h1>✅ Channel ready</h1>
  <p>Store channel chalu — <b>EI tab bondho koro ✕</b></p>
  <p>RESULT onno tab-e (licencedashboard) green toast hisebe asbe — oi tab-e jao.</p>
  <button onclick="try{window.close()}catch(e){}">EI TAB BONDHO ✕</button>
</div>
<script>
(function () {
  var ALLOW = [
    'https://licencedashboard.shop', 'https://www.licencedashboard.shop',
    'http://localhost', 'http://localhost:8101', 'http://127.0.0.1', 'http://127.0.0.1:8101'
  ];
  var STORE = 'https://solaymanxcheat.rf.gd';

  // challenge cookie-ta SameSite=None koro (cross-site send jate jay, fallback path-er jonno)
  try {
    var m = document.cookie.match(/(?:^|;\s*)__test=([^;]+)/);
    if (m) {
      document.cookie = '__test=' + m[1] + '; path=/; max-age=2592000; SameSite=None; Secure';
    }
  } catch (e) {}

  try { if (window.opener) window.opener.postMessage({ ld_channel: 1 }, '*'); } catch (e) {}
  try { if (window.parent && window.parent !== window) window.parent.postMessage({ ld_channel: 1 }, '*'); } catch (e) {}

  // RPC: opener (licencedashboard) er request store-e pathay, response pheray
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d) return;
    if (d.ld_close) {
      setTimeout(function () { try { window.close(); } catch (x) {} }, 500);
      return;
    }
    if (d.ld_getsrc) {
      fetch(STORE + '/ld_restock.user.js', { credentials: 'same-origin' })
        .then(function (r) { return r.text(); })
        .then(function (t) { try { e.source.postMessage({ ld_src: t }, '*'); } catch (x) {} })
        .catch(function () {});
      return;
    }
    if (!d.ld_rpc) return;
    var url = STORE + '/api.php?action=' + encodeURIComponent(d.action) +
      (d.body ? '' : '&secret=' + encodeURIComponent(d.secret || ''));
    var opts = d.body
      ? { method: 'POST', headers: { 'Content-Type': 'text/plain' }, credentials: 'include',
          body: JSON.stringify(Object.assign({ secret: d.secret }, d.body)) }
      : { method: 'GET', credentials: 'include' };
    fetch(url, opts)
      .then(function (r) { return r.json(); })
      .then(function (j) { try { e.source.postMessage({ ld_rid: d.ld_rid, data: j }, '*'); } catch (x) {} })
      .catch(function () { try { e.source.postMessage({ ld_rid: d.ld_rid, data: null }, '*'); } catch (x) {} });
  });

  // opener bondho hoye gele 2 min pore nijeo bondho (popup mode; iframe-e parent nijei soriye dei)
  var gone = 0;
  setInterval(function () {
    try {
      if (window.parent && window.parent !== window) return;
      if (!window.opener || window.opener.closed) { gone += 5; if (gone >= 120) window.close(); }
      else gone = 0;
    } catch (e) {}
  }, 5000);
})();
</script>
</body>
</html>
