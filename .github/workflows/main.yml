name:  Auto Vote

on:
  schedule:
    # Starts once at 8:55 PM Bangladesh time (UTC+6) = 14:55 UTC,
    # 5 minutes early so the connection is ready before 9:00 PM.
    - cron: "55 14 * * *"
  workflow_dispatch: {}     # allows manual run from GitHub UI

jobs:
  vote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Write today's target option
        run: echo "${{ vars.TARGET_OPTION }}" > target-option.txt

      - name: Listen for polls in real time for 30 minutes
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          CHAT_ID: ${{ vars.CHAT_ID }}
        run: timeout 1800 node realtime-vote.js || true
        # 1800 seconds = 30 minutes, covers 8:55-9:25 PM (9:00-9:20 plus buffer).
        # "|| true" because `timeout` exits with code 124 when the time
        # limit is reached - that's expected, not a failure.

      - name: Commit voted-polls.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- voted-polls.json; then
            git add voted-polls.json
            git commit -m "Update voted polls log [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
