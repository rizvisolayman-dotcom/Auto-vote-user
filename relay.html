<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOLAYMAN Relay — keep this tab open</title>
<style>
  body{margin:0;background:#0b0d14;color:#e6e9f2;font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{width:min(560px,94vw);background:#121524;border:1px solid #232840;border-radius:16px;padding:22px}
  h1{font-size:16px;margin:0 0 4px}
  .sub{color:#8b93ad;font-size:12.5px;margin-bottom:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .pill{display:flex;align-items:center;gap:7px;background:#0d1020;border:1px solid #232840;border-radius:10px;padding:8px 12px;font-size:12.5px;color:#aab3cf}
  .pill b{color:#fff;font-size:15px}
  .dot{width:9px;height:9px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 0 rgba(239,68,68,.5)}
  .dot.on{background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.15);animation:p 1.6s infinite}
  @keyframes p{50%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
  .log{background:#0d1020;border:1px solid #232840;border-radius:10px;padding:10px 12px;height:150px;overflow-y:auto;font:11.5px/1.7 ui-monospace,Menlo,Consolas,monospace;color:#7fe7a5;white-space:pre-wrap;word-break:break-all}
  .warn{margin-top:12px;font-size:12px;color:#f59e0b;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:10px;padding:9px 12px}
  .foot{margin-top:10px;font-size:11.5px;color:#6b7392}
</style>
</head>
<body>
<div class="card">
  <h1>⚡ SOLAYMAN Auto-Delivery Relay</h1>
  <div class="sub">Ei tab OPEN rakhben (background-e thik ache, kintu band korben na). Order = key auto buyer-er kache.</div>
  <div class="row">
    <div class="pill"><span class="dot" id="dLive"></span> Licence link</div>
    <div class="pill">Jobs sent <b id="cSent">0</b></div>
    <div class="pill">Keys received <b id="cKeys">0</b></div>
    <div class="pill">Failed <b id="cFail">0</b></div>
  </div>
  <div class="log" id="log"></div>
  <div class="warn" id="warn" style="display:none"></div>
  <div class="foot">Powering: store → licence site → key → buyer. Sirf ei ekta tab. ✅</div>
</div>
<script>
(function(){
'use strict';
var K='[REDACTED_STOCK_SECRET]';
var NJ='https://ntfy.sh/';
var T_JOB='sxc-job-8d41f2a9', T_KEY='sxc-key-8d41f2a9', T_ACK='sxc-ack-8d41f2a9';
var API='api.php';
var sent={}, nSent=0, nKeys=0, nFail=0, lastPub={};
var $=function(id){return document.getElementById(id);};
function log(s){
  var el=$('log');
  el.textContent=(new Date()).toLocaleTimeString()+'  '+s+'\n'+el.textContent;
  if(el.textContent.length>6000) el.textContent=el.textContent.slice(0,6000);
}
function bump(id,n){var el=$(id);el.textContent=String(n);el.style.color='#fff';}
function publish(topic, text){
  return fetch(NJ+encodeURIComponent(topic), {method:'POST', body:text, keepalive:true})
    .then(function(r){ if(!r.ok) throw new Error('ntfy '+r.status); });
}
function api(action, data){
  var body=new URLSearchParams();
  body.set('secret',K); body.set('action',action);
  if(data) Object.keys(data).forEach(function(k){ body.set(k, typeof data[k]==='object'?JSON.stringify(data[k]):String(data[k])); });
  return fetch(API+'?action='+encodeURIComponent(action), {method:'POST', body:body, credentials:'same-origin'})
    .then(function(r){ return r.json(); });
}

/* ---- send pending jobs -> ntfy (republish every 6s until done) ---- */
function pumpJobs(){
  api('dj_list').then(function(j){
    if(!j.ok) return;
    var now=Date.now();
    (j.jobs||[]).forEach(function(job){
      var last=lastPub[job.code]||0;
      if(now-last<6000) return;
      lastPub[job.code]=now;
      publish(T_JOB, JSON.stringify({code:job.code,product:job.product,validity:job.validity,qty:job.qty}))
        .then(function(){
          if(!sent[job.code]){sent[job.code]=1;nSent++;bump('cSent',nSent);}
          log('SEND '+job.code+' · '+job.product+' · '+job.validity+' ×'+job.qty);
        })
        .catch(function(e){ log('SEND-ERR '+job.code+' '+e.message); });
    });
  }).catch(function(){});
}
setInterval(pumpJobs, 3000);
pumpJobs();

/* ---- receive keys <- ntfy SSE ---- */
function openKeyStream(){
  try{
    var es=new EventSource(NJ+encodeURIComponent(T_KEY)+'/sse');
    es.onopen=function(){ $('dLive').classList.add('on'); $('warn').style.display='none'; log('SSE connected'); };
    es.onerror=function(){ $('dLive').classList.remove('on'); log('SSE reconnecting…'); };
    es.onmessage=function(ev){
      var m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
      var body; try{ body=JSON.parse(m.message||''); }catch(e){ return; }
      if(!body || !body.code) return;
      if(body.err){
        nFail++; bump('cFail',nFail);
        api('dj_mark',{code:body.code,status:'failed',err:String(body.err).slice(0,250)})
          .then(function(){ log('FAIL '+body.code+' · '+body.err); publish(T_ACK,JSON.stringify({code:body.code})); })
          .catch(function(){});
        return;
      }
      var key=(body.key||'').trim();
      if(!key && body.keys && body.keys.length) key=body.keys.join('\n');
      if(!key) return;
      api('stock_key',{code:body.code,key:key}).then(function(r){
        if(!r.ok){ log('KEY-REJECT '+body.code+' '+(r.msg||'')); return; }
        nKeys++; bump('cKeys',nKeys);
        log('KEY  '+body.code+' → '+key);
        publish(T_ACK, JSON.stringify({code:body.code})).catch(function(){});
      }).catch(function(e){ log('KEY-ERR '+body.code+' '+e.message); });
    };
  }catch(e){ log('SSE init failed '+e.message); }
}
openKeyStream();
log('Relay started');
})();
</script>
</body>
</html>
